// Class Selector legacy
echo "^2exec legacy/class-selector.cfg"

set play_sound "play sound/menu/select.wav"

set _on_default "bind LEFTALT weapalt; cg_customcrosshair 2"
set _on_fops "exec selector/fops; cg_customcrosshair 2"
set _on_rifle "vstr _on_default; cg_customcrosshair 0"

set classengi "vstr classengi1"
set classengi1 "vstr classrecycle; class e 1; set cfg vstr _on_default;vstr play_sound; set classengi vstr classengi2; echo "^3>^zClass: ^7Miguel^o/^7smg"; say_team "^3>^zClass: ^7Miguel^o/^7smg""
set classengi2 "class e 2; set cfg vstr _on_rifle;vstr play_sound; set classengi vstr classengi1; echo "^3>^zClass: ^7Miguel^o/^7riflenade"; say_team "^3>^zClass: ^7Miguel^o/^7riflenade""

set classmg42 "vstr classrecycle; class s 2;set cfg vstr _on_default;vstr play_sound; echo "^3>^zClass: ^7Jose^d/^7mg42";say_team "^3>^zClass: ^7Jose^d/^7mg42""

set classfieldop "vstr classrecycle; class f 1;set cfg vstr _on_fops;vstr play_sound; echo "^3>^zClass: ^7Blud";say_team "^3>^zClass: ^7Blud""

set classsoldier "vstr class-soldier-panza"
set class-soldier-panza "vstr classrecycle; class s 4 3;set cfg vstr _on_default;vstr play_sound; set classsoldier vstr class-soldier-mortar; echo "^3>^zClass: ^7Jose^d/^7panzer";say_team "^3>^zClass: ^7Jose^d/^7panzer""
set class-soldier-mortar "class s 5 3;set cfg vstr _on_default;vstr play_sound; set classsoldier vstr class-soldier-mg42; echo "^3>^zClass: ^7Jose^d/^7mortar"; say_team "^3>^zClass: ^7Jose^d/^7mortar""
set class-soldier-mg42 "class s 2 3;set cfg vstr _on_default;vstr play_sound; set classsoldier vstr class-soldier-flamer; echo "^3>^zClass: ^7Jose^d/^7mg42"; say_team "^3>^zClass: ^7Jose^d/^7mg42""
set class-soldier-flamer "class s 3 3;set cfg "exec selector/nic.cfg";vstr play_sound; set classsoldier vstr class-soldier-panza; echo "^3>^zClass: ^7Jose^d/^7flamer";say_team "^3>^zClass: ^7Jose^d/^7flamer""
set class-soldier-smg "class s 1 2;set cfg "exec selector/nic.cfg";vstr play_sound; set classsoldier vstr class-soldier-panza; echo "^3>^zClass: ^7Jose^d/^7smg";say_team "^3>^zClass: ^7Jose^d/^7smg""

set classmedic "vstr classrecycle; class m 1;set cfg vstr _on_default;vstr play_sound; echo "^3>^zClass: ^7Guillermo"; say_team "^3>^zClass: ^7Guillermo""

set classcovop "vstr classcovop1"
set classcovop1 "vstr classrecycle; class c 1;set cfg vstr _on_default;vstr play_sound; set classcovop vstr classcovop2; echo "^3>^zClass: ^7Snitch^a/^7sten"; say_team "^3>^zClass: ^7Snitch^a/^7sten""
set classcovop2 "class c 2;set cfg vstr _on_default;vstr play_sound; set classcovop vstr classcovop3; echo "^3>^zClass: ^7Snitch^a/^7fg42"; say_team "^3>^zClass: ^7Snitch^a/^7fg42""
set classcovop3 "class c 3;set cfg vstr _on_default;vstr play_sound; set classcovop vstr classcovop1; echo "^3>^zClass: ^7Snitch^a/^7sniper"; say_team "^3>^zClass: ^7Snitch^a/^7sniper""
set classrecycle "set classengi vstr classengi1; set classcovop vstr classcovop1; set classsoldier vstr class-soldier-panza"
